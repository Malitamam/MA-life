name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  yayinla:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Site klasörü
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js stil.css src vendor fonts ikon _site/
          sed -i "s/MALI_SURUM = '[^']*'/MALI_SURUM = '1.0.${{ github.run_number }}'/" _site/index.html
          sed -i "s/mali-v1/mali-${{ github.sha }}/" _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dagit
        uses: actions/deploy-pages@v4
